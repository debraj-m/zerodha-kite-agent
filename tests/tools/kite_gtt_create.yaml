tool: kite_gtt_create
behaviour: Needs confirmed true. Refuses unless orders are switched on, and over the quantity limit (10) or order value limit (₹10,000). Zerodha then watches the price and places a LIMIT order at the trigger. The same call twice returns the same trigger.
responses:
  - when: The GTT is set (usual)
    latency_ms: 900
    input: { confirmed: true, exchange: NSE, tradingsymbol: ADANIGREEN, transaction_type: SELL, quantity: 5, trigger_price: 1231.25, limit_price: 1225, last_price: 1250, product: CNC }
    output: { trigger_id: 123, note: "Zerodha now watches the price. When it reaches the trigger it places the order; the update comes here if the Postback URL is set." }
  - when: Orders are switched off
    latency_ms: 50
    error: "Order placing is switched off (KITE_ORDERS_ENABLED is not 1). Nothing was sent to Zerodha."
  - when: Over the limit
    latency_ms: 50
    error: "Order value is over the limit of ₹10000. Nothing was sent."
  - when: Not logged in today
    latency_ms: 200
    error: "Kite login needed today. Call kite_login_link and send the person the link."
