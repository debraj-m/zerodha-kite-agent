tool: kite_place_order
behaviour: Needs confirmed true. Refuses unless orders are switched on, and over the quantity limit (10) or order value limit (₹10,000). Returns the order id; the same call twice returns the same id.
responses:
  - when: The order goes through (usual)
    latency_ms: 900
    input: { confirmed: true, exchange: NSE, tradingsymbol: INFY, transaction_type: BUY, quantity: 1, order_type: LIMIT, product: CNC, price: 1500 }
    output: { order_id: "240101000000002", note: "Sent to the exchange. Use kite_orders for its status." }
  - when: Orders are switched off
    latency_ms: 50
    error: "Order placing is switched off (KITE_ORDERS_ENABLED is not 1). Nothing was sent to Zerodha."
  - when: Over the limit
    latency_ms: 50
    error: "Quantity 50 is over the limit of 10. Nothing was sent."
  - when: Not logged in today
    latency_ms: 200
    error: "Kite login needed today. Open https://kite.zerodha.com/connect/login?v=3&api_key=testkey, sign in with 2FA, and try again."
